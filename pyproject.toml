[project]
name = "evofilm"
version = "0.1.0"
description = "The open-source AI film director that evolves with every film: code-rendered explainer, history and lesson videos, any model, self-improving."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "EvoFilm contributors" }]
keywords = ["video", "ai-agent", "agent-skills", "hyperframes", "self-improvement", "rsi", "explainer", "manim", "chinese"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Video",
  "Environment :: Console",
]
dependencies = [
  "edge-tts>=7.0",
  "fonttools>=4.50",
  "brotli>=1.1",
  "numpy>=1.26",
  "soundfile>=0.12",
]

[project.optional-dependencies]
manim = ["manim>=0.19"]
dev = ["pytest>=8"]

[project.scripts]
evofilm = "evofilm.cli:main"

[project.urls]
Homepage = "https://github.com/evofilm/evofilm"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evofilm"]
exclude = ["*.test.mjs"]

[tool.hatch.build.targets.sdist]
exclude = [".github", "docs/assets"]

[tool.pytest.ini_options]
testpaths = ["tests"]
