[project]
name = "reels-rsi"
version = "0.1.0"
description = "The open-source AI reel director that evolves with every reel: code-rendered explainer, history and lesson videos, any model, self-improving."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Reels-RSI contributors" }]
keywords = ["video", "ai-agent", "agent-skills", "hyperframes", "self-improvement", "rsi", "explainer", "manim", "chinese"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Video",
  "Environment :: Console",
]
dependencies = [
  "edge-tts>=7.0",
  "fonttools>=4.50",
  "brotli>=1.1",
  "numpy>=1.26",
  "soundfile>=0.12",
]

[project.optional-dependencies]
manim = ["manim>=0.19"]
dev = ["pytest>=8"]

[project.scripts]
reels = "reels_rsi.cli:main"
reels-rsi = "reels_rsi.cli:main"

[project.urls]
Homepage = "https://github.com/agentic-loops-x/Reels-RSI"
Issues = "https://github.com/agentic-loops-x/Reels-RSI/issues"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reels_rsi"]
exclude = ["*.test.mjs"]

[tool.hatch.build.targets.sdist]
exclude = [".github", "docs/assets"]

[tool.pytest.ini_options]
testpaths = ["tests"]
